apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app
spec: 
  replicas: 2
  selector:
    matchLabels:
      app: node-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
        - name: node-app
          image: <ECR_IMAGE_PLACEHOLDER>
          ports:
            - containerPort: 3000
         